<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if site.naver_verification != "" %}<meta name="naver-site-verification" content="{{ site.naver_verification }}">{% endif %}
{% seo %}
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<div class="top"><div class="wrap"><a class="logo" href="{{ '/' | relative_url }}">{{ site.title }}</a><a class="write" href="{{ '/admin/' | relative_url }}" rel="nofollow">글쓰기</a></div></div>
<div class="wrap">{{ content }}</div>
<footer>{{ site.description }}<br>무료상담 <a href="tel:{{ site.phone }}">{{ site.phone }}</a></footer>
<a class="call" href="tel:{{ site.phone }}">전화상담 {{ site.phone }}</a>
</body>
</html>
